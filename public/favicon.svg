<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- MotoIQ. Rozklad ofert rynku (szare slupki, wysoki srodek = mediana),
       akcentowy slupek = wyrozniony egzemplarz, ptaszek go zaznacza.
       Dark-only: strona jedzie wylacznie w motywie ciemnym, wiec favicon
       tez. Kolory = te same tokeny co reszta systemu (bg-card, border-strong,
       accent). Ciemny kafel czyta sie na jasnej i ciemnej karcie przegladarki.
       Uwaga: w komentarzu XML nie moze wystapic podwojny myslnik. -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#0F172A"/>
  <rect x="2.1"  y="21" width="2.6" height="4"  rx="1" fill="#334155"/>
  <rect x="6.3"  y="16" width="2.6" height="9"  rx="1" fill="#334155"/>
  <rect x="10.5" y="11" width="2.6" height="14" rx="1" fill="#334155"/>
  <rect x="14.7" y="7"  width="2.6" height="18" rx="1" fill="#334155"/>
  <rect x="18.9" y="11" width="2.6" height="14" rx="1" fill="#334155"/>
  <rect x="23.1" y="16" width="2.6" height="9"  rx="1" fill="#3B82F6"/>
  <rect x="27.3" y="21" width="2.6" height="4"  rx="1" fill="#334155"/>
  <path d="M 22.6 12 L 24.4 14 L 26.2 12"
        fill="none" stroke="#3B82F6" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
